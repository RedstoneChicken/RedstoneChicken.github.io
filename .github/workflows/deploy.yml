name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ] # Runs automatically every time you push to main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment to prevent conflicts
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci # Ensures a clean, predictable install for production

      - name: Compile TanStack/Vite App
        run: npm run build

      - name: Package Static Build Assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist' # Changed from .output/public to target your actual React app folder

      - name: Publish Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

