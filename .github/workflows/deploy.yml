name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Updated to Node 22 to clear GitHub's deprecation warnings
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Compile TanStack/Vite App
        run: npm run build

      - name: Package Static Build Assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.output/public' # Reverted back: TanStack Start wraps Vite and outputs to here

      - name: Publish Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
